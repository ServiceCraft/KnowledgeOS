services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    expose:
      - "8080"
    # Mount the repository read-only so the backup snapshot endpoint can serve
    # the current full-project source (BACKUP_CODE_PATH=/src).
    volumes:
      - ./:/src:ro
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-knowledgeos}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-knowledgeos}
      - APP_PROFILE=${APP_PROFILE:-local}
      - JWT_SECRET=${JWT_SECRET}
      - SUPERADMIN_EMAIL=${SUPERADMIN_EMAIL}
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      # Bot / YandexGPT
      - SECRETS_ENCRYPTION_KEY=${SECRETS_ENCRYPTION_KEY:-}
      - YANDEX_ENDPOINT=${YANDEX_ENDPOINT:-https://ai.api.cloud.yandex.net/v1}
      - YANDEX_FOLDER_ID=${YANDEX_FOLDER_ID:-}
      - YANDEX_API_KEY=${YANDEX_API_KEY:-}
      - YANDEX_DEFAULT_CHAT_MODEL_LITE=${YANDEX_DEFAULT_CHAT_MODEL_LITE:-}
      - YANDEX_DEFAULT_CHAT_MODEL_PRO=${YANDEX_DEFAULT_CHAT_MODEL_PRO:-}
      - YANDEX_EMBEDDING_DOC_MODEL=${YANDEX_EMBEDDING_DOC_MODEL:-text-embeddings-v2-doc}
      - YANDEX_EMBEDDING_QUERY_MODEL=${YANDEX_EMBEDDING_QUERY_MODEL:-text-embeddings-v2-query}
      - YANDEX_TIMEOUT_SECONDS=${YANDEX_TIMEOUT_SECONDS:-30}
      - YANDEX_MAX_RETRIES=${YANDEX_MAX_RETRIES:-3}
      - BOT_CHAT_DEBUG_LOG=${BOT_CHAT_DEBUG_LOG:-false}
      - MAX_EXTRA_CA_CERT_FILE=${MAX_EXTRA_CA_CERT_FILE:-}
      - MAX_EXTRA_CA_CERT_PEM=${MAX_EXTRA_CA_CERT_PEM:-}
      - MAX_INSECURE_SKIP_VERIFY=${MAX_INSECURE_SKIP_VERIFY:-false}
      - RAG_WORKER_ENABLED=${RAG_WORKER_ENABLED:-true}
      - RAG_WORKER_BATCH_SIZE=${RAG_WORKER_BATCH_SIZE:-10}
      - RAG_WORKER_POLL_INTERVAL_SECONDS=${RAG_WORKER_POLL_INTERVAL_SECONDS:-5}
      - RAG_INDEX_MAX_ATTEMPTS=${RAG_INDEX_MAX_ATTEMPTS:-5}
      - RAG_VECTOR_TOP_K=${RAG_VECTOR_TOP_K:-20}
      - RAG_HYBRID_TOP_K=${RAG_HYBRID_TOP_K:-8}
      # Backup snapshot endpoint
      - BACKUP_API_KEY=${BACKUP_API_KEY:-}
      - BACKUP_CODE_PATH=/src
      - BACKUP_GIT_COMMIT=${GIT_COMMIT:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-knowledgeos}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-knowledgeos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledgeos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  sync-agent:
    build:
      context: ./backend
      dockerfile: Dockerfile.sync
    profiles:
      - sync
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-knowledgeos}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-knowledgeos}
      - APP_PROFILE=${APP_PROFILE:-local}
      - CLOUD_API_URL=${CLOUD_API_URL}
      - CLOUD_API_KEY=${CLOUD_API_KEY}
      - SYNC_INTERVAL_SECONDS=${SYNC_INTERVAL_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy

  # Backup service. Normally deployed on an INDEPENDENT host pointing at the
  # public HTTPS URL of the app; included here (profile "backup") for local
  # end-to-end testing against the in-compose app over the internal network.
  backup-service:
    build:
      context: ./backup-service
      dockerfile: Dockerfile
    profiles:
      - backup
    environment:
      - APP_URL=${BACKUP_APP_URL:-http://app:8080}
      - APP_API_KEY=${BACKUP_API_KEY}
      - GITHUB_REPO_URL=${GITHUB_REPO_URL}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_BRANCH=${GITHUB_BRANCH:-backup}
      - BACKUPS_PATH=/data/backups
      - BACKUPS_KEEP=${BACKUPS_KEEP:-30}
      - SCHEDULE_CRON=${SCHEDULE_CRON:-0 3 * * *}
      - HTTP_TIMEOUT_SECONDS=${HTTP_TIMEOUT_SECONDS:-600}
    volumes:
      - backup-data:/data
    restart: unless-stopped
    depends_on:
      - app

volumes:
  pgdata:
  backup-data:

