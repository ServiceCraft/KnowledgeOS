worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Preserve X-Forwarded-Proto from an outer TLS-terminating proxy; fall back to
    # the local connection scheme when the header is absent.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 100M;

        # Backup snapshot: the archive (pg_dump + code tar) can be large and is
        # built before the first byte is written, so disable response buffering
        # and allow a long timeout to avoid premature 504s.
        location = /api/v1/backup/snapshot {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_buffering off;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
        }

        # API proxy
        location /api/ {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Static assets with caching
        location /assets/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SPA fallback
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    # --- HTTPS (production) ---------------------------------------------------
    # The backup snapshot endpoint and the API must be served over HTTPS. TLS is
    # terminated here. Certificates are per-deployment and are NOT committed to
    # the repo — mount them into the container and uncomment this block (and the
    # 80->443 redirect below). Reuse the same location blocks as the :80 server.
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name your.domain;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     # ... same location = /api/v1/backup/snapshot, location /api/, /assets/, / blocks ...
    # }
    #
    # Redirect plain HTTP to HTTPS once TLS is enabled:
    # server {
    #     listen 80;
    #     server_name your.domain;
    #     return 301 https://$host$request_uri;
    # }
}
