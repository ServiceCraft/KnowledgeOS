openapi: 3.1.0
info:
  title: KnowledgeOS Bot Chat API
  version: 1.0.0
  summary: API для чата с ботом KnowledgeOS
  description: |
    Спецификация описывает API playground-чата с ботом KnowledgeOS.

    Эти методы нужны, чтобы создать диалоговую сессию внутри компании текущего
    пользователя, отправлять вопросы боту, получать ответы, смотреть историю
    сообщений и строить UI с потоковой генерацией ответа.

    Все методы находятся в tenant-контексте: backend определяет компанию по JWT
    текущего пользователя и не требует передавать `company_id` в запросах.
servers:
  - url: http://localhost:8080/api/v1
    description: Локальный backend
  - url: /api/v1
    description: Относительный путь для frontend/proxy
tags:
  - name: Bot Chat
    description: Сессии и сообщения чата с ботом
security:
  - bearerAuth: []
paths:
  /admin/bot/chat/sessions:
    post:
      tags:
        - Bot Chat
      operationId: createBotChatSession
      summary: Создать сессию чата
      description: |
        Создаёт новую сессию диалога с ботом в компании текущего пользователя.

        Используйте этот метод перед первой отправкой сообщения. Сессия хранит
        канал общения, внешний идентификатор чата при интеграциях и историю
        сообщений. Если `channel` не передан, backend создаёт сессию с каналом
        `playground`.

        Для чего использовать:
        - открыть новый диалог в админском playground;
        - связать внешний чат Telegram/MAX/VK/API с внутренней сессией;
        - получить `id`, который затем передаётся в методы отправки сообщений
          и чтения истории.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatSessionRequest'
            examples:
              playground:
                summary: Сессия для playground
                value:
                  channel: playground
                  title: Проверка ответов по базе знаний
              externalApi:
                summary: Сессия для внешней API-интеграции
                value:
                  channel: api
                  external_chat_id: client-chat-42
      responses:
        '201':
          description: Сессия создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
        - Bot Chat
      operationId: listBotChatSessions
      summary: Получить список сессий чата
      description: |
        Возвращает постраничный список сессий чата текущей компании.

        Список отсортирован так, чтобы последние активные диалоги были первыми:
        сначала по `last_message_at`, затем по `created_at`. Метод удобен для
        боковой панели истории диалогов или административного просмотра
        последних обращений.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Список сессий и общее количество
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/bot/chat/sessions/{id}:
    get:
      tags:
        - Bot Chat
      operationId: getBotChatSession
      summary: Получить сессию с историей сообщений
      description: |
        Возвращает одну сессию и последние сообщения внутри неё.

        Используйте метод, когда пользователь открывает существующий диалог:
        UI получает метаданные сессии, историю реплик пользователя и ассистента,
        источники ответа и статистику токенов по уже сохранённым сообщениям.

        Backend отдаёт только сессию из компании текущего пользователя. Если
        `id` принадлежит другой компании или не существует, будет возвращена
        ошибка `404`.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Сессия и сообщения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionWithMessagesEnvelope'
        '400':
          $ref: '#/components/responses/InvalidSessionID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SessionNotFound'
  /admin/bot/chat/sessions/{id}/messages:
    post:
      tags:
        - Bot Chat
      operationId: sendBotChatMessage
      summary: Отправить сообщение и получить готовый ответ
      description: |
        Добавляет сообщение пользователя в сессию, подбирает релевантные
        фрагменты базы знаний через RAG, отправляет историю и контекст в LLM,
        сохраняет ответ ассистента и возвращает полный результат одним JSON.

        Используйте этот метод, когда клиенту не нужен streaming UX и можно
        дождаться полного ответа. Для интерфейса с постепенным появлением текста
        используйте `/messages/stream`.

        В ответе:
        - `user` — сохранённое сообщение пользователя;
        - `message` — сохранённый ответ ассистента;
        - `sources` — источники из базы знаний, которые были переданы в LLM;
        - `session` — обновлённая сессия, включая `title` и `last_message_at`.

        Возможные бизнес-ошибки:
        - `409 bot is disabled` — бот выключен в настройках компании;
        - `409 chat session is not handled by bot` — сессия закрыта или больше
          не обслуживается ботом;
        - `404 chat session not found` — сессия не найдена в текущем tenant.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChatMessageRequest'
            examples:
              question:
                summary: Вопрос пользователя
                value:
                  content: Какие услуги входят в базовый тариф?
      responses:
        '200':
          description: Сообщение пользователя, ответ бота и использованные источники
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatExchangeEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/ChatConflict'
  /admin/bot/chat/sessions/{id}/messages/stream:
    post:
      tags:
        - Bot Chat
      operationId: streamBotChatMessage
      summary: Отправить сообщение и получить ответ потоком
      description: |
        Работает как синхронная отправка сообщения, но возвращает результат в
        формате Server-Sent Events (`text/event-stream`).

        Используйте этот метод для чата в UI, где ответ должен появляться по
        мере генерации. Клиент отправляет обычный JSON-запрос, затем читает SSE
        события до события `done`.

        Формат каждого SSE-сообщения:

        ```text
        event: delta
        data: {"type":"delta","delta":"часть ответа"}
        ```

        Возможные типы событий:
        - `sources` — список источников из базы знаний, найденных перед генерацией;
        - `delta` — очередной фрагмент текста ответа;
        - `usage` — статистика токенов, если провайдер её вернул;
        - `message` — финальное сохранённое сообщение ассистента;
        - `error` — ошибка генерации или сохранения, передаётся внутри stream;
        - `done` — stream завершён.

        Если ошибка происходит до открытия stream, backend возвращает обычный
        JSON error response. Если ошибка происходит после открытия stream,
        клиент получает SSE-событие `error`, затем `done`.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChatMessageRequest'
            examples:
              question:
                summary: Вопрос пользователя
                value:
                  content: Как оператору отвечать на вопрос о рассрочке?
      responses:
        '200':
          description: |
            SSE-поток с источниками, фрагментами ответа, usage и финальным
            сообщением ассистента.
          content:
            text/event-stream:
              schema:
                type: string
                description: Поток Server-Sent Events, где `data` содержит JSON ChatStreamEvent.
              examples:
                stream:
                  summary: Пример последовательности событий
                  value: |
                    event: sources
                    data: {"type":"sources","sources":[{"source_id":"qa:1:0","entity_type":"qa","entity_id":"9d62b575-9838-44e4-9a55-82fc7cdb62e8","chunk_idx":0,"title":"Тарифы","content":"...","score":0.91}]}

                    event: delta
                    data: {"type":"delta","delta":"В базовый тариф входит "}

                    event: message
                    data: {"type":"message","message":{"id":"4d02f2d2-f030-41c8-a02a-d82e5e4b67bb","created_at":"2026-06-25T13:26:00Z","updated_at":"2026-06-25T13:26:00Z","company_id":"9d62b575-9838-44e4-9a55-82fc7cdb62e8","session_id":"6dfc4fb7-9635-43a8-b4db-0e92b62021c1","role":"assistant","content":"В базовый тариф входит ...","tool_calls":[],"sources":[],"tokens_prompt":310,"tokens_completion":64}}

                    event: done
                    data: {"type":"done"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          $ref: '#/components/responses/ChatConflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token из `/auth/login` или `/auth/refresh`.
        Передаётся в заголовке `Authorization: Bearer <token>`.
  parameters:
    SessionID:
      name: id
      in: path
      required: true
      description: UUID сессии чата.
      schema:
        type: string
        format: uuid
      example: 6dfc4fb7-9635-43a8-b4db-0e92b62021c1
    Page:
      name: page
      in: query
      required: false
      description: Номер страницы, начиная с 1. Если не передан, используется 1.
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Количество сессий на странице. Если не передан, используется 30.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
      example: 30
  responses:
    BadRequest:
      description: Некорректное тело запроса или значение параметра.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            invalidBody:
              value:
                error: invalid request body
            emptyContent:
              value:
                error: content is required
    InvalidSessionID:
      description: "`id` в path не является валидным UUID."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: invalid session id
    Unauthorized:
      description: JWT отсутствует, истёк или не прошёл проверку.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: unauthorized
    SessionNotFound:
      description: Сессия не найдена или не принадлежит компании текущего пользователя.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: chat session not found
    ChatConflict:
      description: Текущее состояние сессии или настроек не позволяет получить ответ бота.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            botDisabled:
              value:
                error: bot is disabled
            sessionClosed:
              value:
                error: chat session is not handled by bot
  schemas:
    Envelope:
      type: object
      description: Стандартная JSON-обёртка backend.
      properties:
        data:
          description: Полезная нагрузка ответа.
        error:
          type: string
          description: Текст ошибки. Присутствует только в error responses.
        total:
          type: integer
          format: int64
          description: Общее количество элементов. Присутствует только в списках.
    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required:
            - error
          properties:
            error:
              type: string
    ChatSessionEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/ChatSession'
    ChatSessionListEnvelope:
      type: object
      required:
        - data
        - total
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ChatSession'
        total:
          type: integer
          format: int64
          description: Общее количество сессий текущей компании.
    ChatSessionWithMessagesEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/ChatSessionWithMessages'
    ChatExchangeEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/ChatExchange'
    CreateChatSessionRequest:
      type: object
      additionalProperties: false
      properties:
        channel:
          $ref: '#/components/schemas/ChatChannel'
        external_chat_id:
          type: string
          description: |
            Идентификатор чата во внешней системе. Нужен для интеграций, чтобы
            сопоставить Telegram/MAX/VK/API-диалог с внутренней сессией.
          examples:
            - client-chat-42
        title:
          type: string
          description: |
            Человекочитаемое название сессии. Если пользователь отправит
            сообщение, backend обновит title текстом первого/последнего
            пользовательского сообщения длиной до 80 символов.
          examples:
            - Проверка тарифов
    SendChatMessageRequest:
      type: object
      additionalProperties: false
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          description: |
            Текст вопроса пользователя. Backend обрезает пробелы по краям и
            отклоняет пустую строку.
          examples:
            - Какие услуги входят в базовый тариф?
    ChatSessionWithMessages:
      type: object
      required:
        - session
        - messages
      properties:
        session:
          $ref: '#/components/schemas/ChatSession'
        messages:
          type: array
          description: Сообщения сессии в хронологическом порядке.
          items:
            $ref: '#/components/schemas/ChatMessage'
    ChatExchange:
      type: object
      required:
        - session
        - user
        - message
        - sources
      properties:
        session:
          $ref: '#/components/schemas/ChatSession'
        user:
          $ref: '#/components/schemas/ChatMessage'
        message:
          $ref: '#/components/schemas/ChatMessage'
        sources:
          type: array
          description: Источники из базы знаний, использованные при генерации ответа.
          items:
            $ref: '#/components/schemas/ChatSource'
    ChatStreamEvent:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - sources
            - delta
            - usage
            - message
            - error
            - done
          description: Тип SSE-события.
        delta:
          type: string
          description: Фрагмент текста ответа для события `delta`.
        message:
          $ref: '#/components/schemas/ChatMessage'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/ChatSource'
        usage:
          $ref: '#/components/schemas/Usage'
        error:
          type: string
          description: Текст ошибки для события `error`.
    ChatSession:
      type: object
      required:
        - id
        - created_at
        - updated_at
        - company_id
        - channel
        - state
        - title
      properties:
        id:
          type: string
          format: uuid
          description: UUID сессии.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        company_id:
          type: string
          format: uuid
          description: Компания, которой принадлежит сессия.
        channel:
          $ref: '#/components/schemas/ChatChannel'
        external_chat_id:
          type: string
          description: Внешний ID чата, если сессия создана интеграцией.
        state:
          $ref: '#/components/schemas/ChatState'
        operator_id:
          type: string
          format: uuid
          description: Оператор, если сессия передана человеку.
        title:
          type: string
          description: Название диалога для отображения в списке.
        last_message_at:
          type: string
          format: date-time
          description: Время последнего сообщения в сессии.
    ChatMessage:
      type: object
      required:
        - id
        - created_at
        - updated_at
        - company_id
        - session_id
        - role
        - content
        - tool_calls
        - sources
        - tokens_prompt
        - tokens_completion
      properties:
        id:
          type: string
          format: uuid
          description: UUID сообщения.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        company_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
          description: Сессия, к которой относится сообщение.
        role:
          $ref: '#/components/schemas/ChatRole'
        content:
          type: string
          description: Текст сообщения.
        tool_call_id:
          type: string
          description: |
            Для сообщений с ролью `tool` — идентификатор вызова инструмента
            (`ToolCall.id`), результатом которого является это сообщение.
        tool_calls:
          type: array
          description: |
            Вызовы инструментов, которые LLM запросила в этом сообщении
            ассистента. Бот исполняет их (поиск по базе знаний, прайс,
            информация об услуге) и продолжает диалог сообщениями с ролью `tool`.
          items:
            $ref: '#/components/schemas/ToolCall'
        sources:
          type: array
          description: Источники, связанные с ответом ассистента.
          items:
            $ref: '#/components/schemas/ChatSource'
        tokens_prompt:
          type: integer
          minimum: 0
          description: Количество prompt-токенов, если провайдер вернул usage.
        tokens_completion:
          type: integer
          minimum: 0
          description: Количество completion-токенов, если провайдер вернул usage.
    ChatSource:
      type: object
      required:
        - source_id
        - entity_type
        - entity_id
        - chunk_idx
        - title
        - content
        - score
      properties:
        source_id:
          type: string
          description: Стабильный ID фрагмента в RAG-индексе.
        entity_type:
          type: string
          description: Тип сущности базы знаний.
          examples:
            - qa
            - article
            - pricing
        entity_id:
          type: string
          format: uuid
          description: UUID исходной сущности базы знаний.
        chunk_idx:
          type: integer
          minimum: 0
          description: Номер чанка внутри исходной сущности.
        title:
          type: string
          description: Заголовок источника для показа пользователю.
        content:
          type: string
          description: Полный текст фрагмента, переданный в LLM-контекст.
        snippet:
          type: string
          description: Короткая выдержка для UI, если доступна.
        score:
          type: number
          format: double
          description: Релевантность результата поиска.
    Usage:
      type: object
      required:
        - prompt_tokens
        - completion_tokens
        - total_tokens
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
    ToolCall:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        arguments:
          type: object
          additionalProperties: true
    ChatChannel:
      type: string
      enum:
        - playground
        - api
        - telegram
        - max
        - vk
      default: playground
      description: |
        Канал, из которого пришёл диалог. `playground` используется для
        встроенного админского UI; остальные значения нужны для внешних
        интеграций.
    ChatState:
      type: string
      enum:
        - bot
        - closed
      description: |
        Состояние обработки сессии. Сообщения можно отправлять боту только в
        состоянии `bot`.
    ChatRole:
      type: string
      enum:
        - user
        - assistant
        - tool
        - operator
      description: Автор сообщения в истории чата.
