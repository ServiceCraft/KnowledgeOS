            application/json:
              schema:
                $ref: '#/components/schemas/EntityLinkListEnvelope'
    post:
      tags: [Links]
      operationId: createLink
      summary: Создать ссылку
      description: |
        Создаёт связь с другой сущностью или внешним URL. Backend проставляет
        source из path. В body нужно передать либо `target_type` + `target_id`,
        либо `url`. Требует write-role.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityType'
        - $ref: '#/components/parameters/EntityID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityLinkInput'
      responses:
        '201':
          description: Созданная ссылка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityLinkEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /{entityType}/{entityID}/links/{id}:
    delete:
      tags: [Links]
      operationId: deleteLink
      summary: Удалить ссылку
      description: Удаляет связь/ссылку сущности. Требует write-role.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityType'
        - $ref: '#/components/parameters/EntityID'
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Удалено.
        '400':
          $ref: '#/components/responses/BadRequest'
  /search:
    get:
      tags: [Search]
      operationId: search
      summary: Выполнить поиск по базе знаний
      description: |
        Полнотекстовый поиск по Q&A, статьям и прайсу текущей компании.
        Используйте для глобального поиска в UI и быстрого перехода к
        найденной сущности.
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string }
          description: Поисковый запрос.
        - name: types
          in: query
          schema: { type: string }
          description: CSV-список типов, например `qa,article,pricing`.
        - name: theme_id
          in: query
          schema: { type: string, format: uuid }
          description: Ограничить поиск Q&A по теме.
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
          description: Количество результатов.
      responses:
        '200':
          description: Результаты поиска.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResultListEnvelope'
  /sync/status:
    get:
      tags: [Sync]
      operationId: syncStatus
      summary: Получить статус синхронизации
      description: Возвращает состояние подписки и последний результат синхронизации текущей компании.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Статус sync.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatusEnvelope'
  /sync/push:
    post:
      tags: [Sync]
      operationId: syncPush
      summary: Отправить изменения из внешнего контура
      description: |
        API-key endpoint для применения payload синхронизации к компании,
        которой принадлежит API key. Используется cloud/local sync worker.
      security:
        - syncApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPayload'
      responses:
        '200':
          $ref: '#/components/responses/StatusOK'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /sync/pull:
    get:
      tags: [Sync]
      operationId: syncPull
      summary: Забрать изменения для внешнего контура
      description: |
        API-key endpoint, который собирает изменения текущей компании с момента
        последнего локального watermark. Используется sync worker.
      security:
        - syncApiKey: []
      responses:
        '200':
          description: Payload изменений.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPayloadEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: Получить пользователей компании
      description: |
        Возвращает пользователей текущей компании. Доступно ролям `admin` и
        `superadmin`. Используйте в разделе администрирования пользователей.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: q
          in: query
          schema: { type: string }
          description: Поиск по email.
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/Role' }
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, -created_at]
      responses:
        '200':
          description: Список пользователей.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      operationId: createUser
      summary: Создать пользователя
      description: |
        Создаёт пользователя в текущей компании. Email нормализуется, пароль
        должен быть не короче 8 символов. Назначить `superadmin` может только
        текущий `superadmin`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Созданный пользователь.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/users/{id}:
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Обновить пользователя
      description: |
        Частично обновляет email, пароль, роль и активность. Sensitive changes
        отзывают refresh tokens пользователя. Администратор не может управлять
        другими администраторами, а пользователь не может удалить/понизить себя.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Обновлённый пользователь.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Удалить пользователя
      description: Удаляет пользователя текущей компании с учётом role safety rules.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Удалено.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/bot/settings:
    get:
      tags: [Bot]
      operationId: getBotSettings
      summary: Получить настройки бота
      description: |
        Возвращает настройки LLM-провайдера, модельного tier, температуру,
        лимиты токенов, persona и enabled modules для текущей компании.
        Если настроек ещё нет, backend создаёт default settings.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Настройки бота.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotSettingsEnvelope'
    put:
      tags: [Bot]
      operationId: updateBotSettings
      summary: Обновить настройки бота
      description: |
        Частично обновляет настройки бота. Используйте для включения бота,
        выбора tier/model, настройки persona и параметров генерации.
        Доступно `admin` и `superadmin`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBotSettingsRequest'
      responses:
        '200':
          description: Обновлённые настройки.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotSettingsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /admin/bot/secrets:
    get:
      tags: [Bot]
      operationId: listBotSecrets
      summary: Получить статусы secrets
      description: |
        Возвращает только статусы tenant secrets: kind, is_set, metadata и
        updated_at. Секретные значения никогда не возвращаются.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Статусы секретов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSecretStatusArrayEnvelope'
  /admin/bot/secrets/{kind}:
    put:
      tags: [Bot]
      operationId: setBotSecret
      summary: Установить tenant secret
      description: |
        Шифрует и сохраняет секрет для LLM или внешнего канала. Требует
        настроенный `SECRETS_ENCRYPTION_KEY`. В ответе возвращается только
        status, не plaintext.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SecretKind'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTenantSecretRequest'
      responses:
        '200':
          description: Статус сохранённого секрета.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSecretStatusEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags: [Bot]
      operationId: deleteBotSecret
      summary: Удалить tenant secret
      description: Удаляет секрет выбранного kind для текущей компании.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SecretKind'
      responses:
        '204':
          description: Удалено.
        '400':
          $ref: '#/components/responses/BadRequest'
  /admin/bot/channels/status:
    get:
      tags: [Channels]
      operationId: listChannelStatus
      summary: Получить статус каналов
      description: |
        Возвращает настройки Telegram, MAX и VK для текущего tenant: включён ли
        канал через `enabled_modules.channels`, задан ли token secret, публичный
        webhook URL и сохранённую metadata без plaintext token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Статусы каналов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelStatusArrayEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/bot/rag/reindex:
    post:
      tags: [RAG]
      operationId: reindexRAG
      summary: Запустить переиндексацию RAG
      description: |
        Очищает embeddings текущей компании и ставит jobs на upsert всех статей,
        Q&A и pricing nodes. Используйте после массового импорта или смены
        embedding-настроек.
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Переиндексация поставлена в очередь.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusEnvelope'
              example:
                data: { status: queued }
  /admin/bot/rag/index-status:
    get:
      tags: [RAG]
      operationId: ragIndexStatus
      summary: Получить статус RAG-индекса
      description: Возвращает количество embeddings и статистику jobs по статусам.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Статус индекса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RAGIndexStatusEnvelope'
  /admin/bot/rag/search:
    post:
      tags: [RAG]
      operationId: ragSearch
      summary: Выполнить RAG retrieval
      description: |
        Выполняет hybrid retrieval: lexical search + vector search + RRF merge.
        Используйте для отладки того, какие фрагменты базы знаний попадут в
        контекст бота.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RAGSearchRequest'
      responses:
        '200':
          description: Результат retrieval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveResultEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /admin/bot/chat/sessions:
    post:
      tags: [Bot Chat]
      operationId: createBotChatSession
      summary: Создать сессию чата
      description: |
        Создаёт новую диалоговую сессию с ботом в tenant-контексте. Сначала
        вызовите этот метод, затем отправляйте сообщения в `/messages` или
        `/messages/stream`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatSessionRequest'
      responses:
        '201':
          description: Созданная сессия.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [Bot Chat]
      operationId: listBotChatSessions
      summary: Получить список сессий чата
      description: Возвращает последние активные chat sessions текущей компании.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          schema: { type: integer, default: 30 }
      responses:
        '200':
          description: Список сессий.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionListEnvelope'
  /admin/bot/chat/sessions/{id}:
    get:
      tags: [Bot Chat]
      operationId: getBotChatSession
      summary: Получить сессию с историей
      description: Возвращает метаданные сессии и до 200 последних сообщений.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Сессия и сообщения.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionWithMessagesEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/bot/chat/sessions/{id}/messages:
    post:
      tags: [Bot Chat]
      operationId: sendBotChatMessage
      summary: Отправить сообщение боту
      description: |
        Сохраняет user message, выполняет RAG retrieval, вызывает LLM, сохраняет
        assistant message и возвращает готовый ответ одним JSON. Подходит для
        интеграций без streaming UX.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChatMessageRequest'
      responses:
        '200':
          description: Полный обмен сообщениями.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatExchangeEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/bot/handoff/sessions:
    get:
      tags: [Bot Handoff]
      operationId: listHandoffSessions
      summary: Получить очередь handoff-сессий
      description: |
        Возвращает сессии для очереди операторов. `viewer` может видеть очередь
        и свои назначенные диалоги; `admin`/`superadmin` могут управлять всеми.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          schema: { type: integer, default: 30 }
        - name: state
          in: query
          schema:
            type: string
            enum: [bot, waiting_operator, operator, closed]
        - name: operator_id
          in: query
          schema: { type: string, format: uuid }
        - name: channel
          in: query
          schema:
            type: string
            enum: [playground, api, telegram, max, vk]
        - name: active
          in: query
          description: Если true, возвращает только активные handoff-состояния `waiting_operator` и `operator`.
          schema: { type: boolean }
      responses:
        '200':
          description: Список сессий.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/bot/handoff/sessions/metrics:
    get:
      tags: [Bot Handoff]
      operationId: getHandoffMetrics
      summary: Получить метрики handoff-сессий
      description: Возвращает агрегаты по состояниям и активным каналам с теми же правилами видимости, что и очередь.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Метрики handoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionMetricsEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/bot/handoff/sessions/{id}:
    get:
      tags: [Bot Handoff]
      operationId: getHandoffSession
      summary: Получить handoff-сессию с историей
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Сессия и сообщения.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionWithMessagesEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/bot/handoff/sessions/{id}/claim:
    post:
      tags: [Bot Handoff]
      operationId: claimHandoffSession
      summary: Взять диалог оператором
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Сессия назначена текущему оператору.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/bot/handoff/sessions/{id}/messages:
    post:
      tags: [Bot Handoff]
      operationId: sendHandoffOperatorMessage
      summary: Отправить сообщение от оператора
      description: Сохраняет `role=operator` и отправляет сообщение во внешний канал, если сессия привязана к Telegram/MAX/VK.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChatMessageRequest'
      responses:
        '201':
          description: Сохраненное сообщение оператора.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/bot/handoff/sessions/{id}/release:
    post:
      tags: [Bot Handoff]
      operationId: releaseHandoffSession
      summary: Вернуть диалог боту
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Сессия возвращена в состояние `bot`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/bot/handoff/sessions/{id}/close:
    post:
      tags: [Bot Handoff]
      operationId: closeHandoffSession
      summary: Закрыть диалог
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Сессия закрыта.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/bot/handoff/sessions/{id}/escalate:
    post:
      tags: [Bot Handoff]
      operationId: escalateHandoffSession
      summary: Ручная эскалация диалога
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalateSessionRequest'
      responses:
        '200':
          description: Сессия переведена в `waiting_operator`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/bot/chat/sessions/{id}/messages/stream:
    post:
      tags: [Bot Chat]
      operationId: streamBotChatMessage
      summary: Отправить сообщение и получить SSE stream
      description: |
        Возвращает Server-Sent Events. Используйте для UI, где ответ бота
        должен появляться по мере генерации.

        События:
        - `sources` — найденные источники;
        - `delta` — фрагмент текста;
        - `usage` — токены, если провайдер вернул usage;
        - `message` — финально сохранённое сообщение ассистента;
        - `error` — ошибка внутри открытого stream;
        - `done` — завершение.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChatMessageRequest'
      responses:
        '200':
          description: SSE поток.
          content:
            text/event-stream:
              schema:
                type: string
                description: Каждое `data:` содержит JSON `ChatStreamEvent`.
              example: |
                event: delta
                data: {"type":"delta","delta":"Ответ начинается..."}

                event: done
                data: {"type":"done"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /export:
    get:
      tags: [Import Export]
      operationId: exportKnowledgeBase
      summary: Экспортировать базу знаний
      description: |
        Возвращает переносимый JSON export текущей компании: themes, Q&A,
        pricing, articles, calls и mentions. Доступно только `superadmin`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Export payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportDataEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
  /import:
    post:
      tags: [Import Export]
      operationId: importKnowledgeBase
      summary: Импортировать базу знаний
      description: |
        Импортирует переносимый JSON export в выбранную через `X-Company-ID`
        компанию.
        Backend переназначает `company_id`, очищает created/updated by и
        дедуплицирует часть сущностей.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportData'
      responses:
        '200':
          description: Результат импорта.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResultEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /admin/companies:
    get:
      tags: [Companies]
      operationId: listCompanies
      summary: Получить компании
      description: Список компаний платформы. Доступно только `superadmin`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit50'
      responses:
        '200':
          description: Список компаний.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyListEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Companies]
      operationId: createCompany
      summary: Создать компанию
      description: Создаёт компанию и sync sequence. Доступно только `superadmin`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyInput'
      responses:
        '201':
          description: Созданная компания.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /admin/companies/{id}:
    get:
      tags: [Companies]
      operationId: getCompany
      summary: Получить компанию
      description: Возвращает компанию по UUID. Доступно только `superadmin`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Компания.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Companies]
      operationId: updateCompany
      summary: Обновить компанию
      description: Обновляет компанию. Доступно только `superadmin`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyInput'
      responses:
        '200':
          description: Обновлённая компания.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags: [Companies]
      operationId: deleteCompany
      summary: Удалить компанию
      description: Удаляет компанию. Доступно только `superadmin`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Удалено.
        '400':
          $ref: '#/components/responses/BadRequest'
  /admin/companies/{id}/admin:
    post:
      tags: [Companies, Users]
      operationId: createCompanyAdmin
      summary: Создать администратора компании
      description: |
        Создаёт пользователя с ролью `admin` в выбранной компании. Используйте
        после создания компании, чтобы выдать ей первого администратора.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyAdminRequest'
      responses:
        '201':
          description: Созданный admin user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /backup/snapshot:
    get:
      tags: [Backup]
      operationId: backupSnapshot
      summary: Скачать полный snapshot
      description: |
        Создаёт и стримит `snapshot-YYYYMMDD-HHMMSS.tar.gz`.
        Архив содержит `metadata.json`, `dump.sql`, `code.tar.gz` и
        `export.json`. Endpoint защищён отдельным backup API key, а не JWT.
      security:
        - backupApiKey: []
      responses:
        '200':
          description: Gzip-compressed tar archive.
          headers:
            Content-Disposition:
              schema: { type: string }
              description: Attachment filename.
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          description: Backup endpoint disabled because key is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token из `/auth/login` или `/auth/refresh`.
    syncApiKey:
      type: http
      scheme: bearer
      description: API key из таблицы `api_keys`, используется только `/sync/push` и `/sync/pull`.
    backupApiKey:
      type: http
      scheme: bearer
      description: Значение `BACKUP_API_KEY`, используется только `/backup/snapshot`.
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: UUID сущности.
    EntityID:
      name: entityID
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: UUID сущности-владельца.
    EntityType:
      name: entityType
      in: path
      required: true
      schema:
        type: string
        enum: [qa, article, pricing]
      description: Тип сущности для polymorphic comments/links.
    SecretKind:
      name: kind
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SecretKind'
      description: Тип tenant secret.
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
      description: Номер страницы, начиная с 1.
    Limit50:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, default: 50 }
      description: Размер страницы.
    Limit100:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, default: 100 }
      description: Размер страницы.
  responses:
    StatusOK:
      description: Операция выполнена.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusEnvelope'
          example:
            data: { status: ok }
    BadRequest:
      description: Некорректный запрос.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: invalid request body
    InvalidID:
      description: Некорректный UUID в path.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: invalid id
    Unauthorized:
      description: Не передан или невалиден token/API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: invalid token
    Forbidden:
      description: Недостаточно прав.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: insufficient permissions
    NotFound:
      description: Сущность не найдена или недоступна в текущем tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: not found
    Conflict:
      description: Конфликт состояния или уникальности.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: conflict
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    StatusEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status:
              type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    LoginResponseEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/LoginResponse'
    LoginResponse:
      type: object
      required: [access_token, refresh_token, expires_at, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_at:
          type: integer
          format: int64
          description: Unix timestamp expiration для access token.
        user:
          $ref: '#/components/schemas/LoginUser'
    LoginUser:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        company_id: { type: string, format: uuid }
    Role:
      type: string
      enum: [superadmin, admin, editor, viewer]
    AIStatus:
      type: string
      enum: [pending, accepted, rejected, edited]
    BaseModel:
      type: object
      required: [id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SyncableFields:
      type: object
      required: [company_id, sync_version, sync_origin]
      properties:
        company_id: { type: string, format: uuid }
        sync_version: { type: integer, format: int64 }
        sync_origin: { type: string }
        created_by: { type: string, format: uuid }
        updated_by: { type: string, format: uuid }
        deleted_at: { type: string, format: date-time }
    Company:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          required: [name, tier]
          properties:
            name: { type: string }
            tier: { type: string, default: local }
    CompanyInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        tier: { type: string, default: local }
    User:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - type: object
          required: [email, role, is_active]
          properties:
            company_id: { type: string, format: uuid }
            email: { type: string, format: email }
            role: { $ref: '#/components/schemas/Role' }
            is_active: { type: boolean }
    CreateUserRequest:
      type: object
      required: [email, password, role]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        role: { $ref: '#/components/schemas/Role' }
        is_active: { type: boolean, default: true }
    UpdateUserRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        role: { $ref: '#/components/schemas/Role' }
        is_active: { type: boolean }
    CreateCompanyAdminRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    Theme:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - $ref: '#/components/schemas/SyncableFields'
        - type: object
          required: [name, description]
          properties:
            name: { type: string }
            description: { type: string }
    ThemeInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
    QAPair:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - $ref: '#/components/schemas/SyncableFields'
        - type: object
          required: [question, answer, is_faq, is_locked, frequency]
          properties:
            theme_id: { type: string, format: uuid }
            question: { type: string }
            answer: { type: string }
            is_faq: { type: boolean }
            is_locked: { type: boolean }
            frequency: { type: integer }
            ai_answer: { type: string }
            ai_status: { $ref: '#/components/schemas/AIStatus' }
            ai_reviewed_by: { type: string, format: uuid }
            ai_reviewed_at: { type: string, format: date-time }
    QAPairInput:
      type: object
      required: [question, answer]
      properties:
        theme_id: { type: string, format: uuid }
        question: { type: string }
        answer: { type: string }
        is_faq: { type: boolean, default: false }
        is_locked: { type: boolean, default: false }
        frequency: { type: integer, default: 0 }
        ai_answer: { type: string }
        ai_status: { $ref: '#/components/schemas/AIStatus' }
    QAPairPatch:
      type: object
      properties:
        theme_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        question: { type: string }
        answer: { type: string }
        is_faq: { type: boolean }
        is_locked: { type: boolean }
        frequency: { type: integer }
        ai_answer: { type: string }
        ai_status: { $ref: '#/components/schemas/AIStatus' }
    QAReviewRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [accept, reject, edit]
        edited_answer:
          type: string
    PricingNode:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - $ref: '#/components/schemas/SyncableFields'
        - type: object
          required: [node_type, name]
          properties:
            parent_id: { type: string, format: uuid }
            node_type: { type: string }
            name: { type: string }
            price: { type: number, format: double }
    PricingNodeInput:
      type: object
      required: [node_type, name]
      properties:
        parent_id: { type: string, format: uuid }
        node_type: { type: string }
        name: { type: string }
        price: { type: number, format: double }
    PricingMoveRequest:
      type: object
      required: [parent_id]
      properties:
        parent_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
    Article:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - $ref: '#/components/schemas/SyncableFields'
        - type: object
          required: [title, body]
          properties:
            title: { type: string }
            body: { type: string }
    ArticleInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
        body: { type: string }
    Comment:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - $ref: '#/components/schemas/SyncableFields'
        - type: object
          required: [entity_type, entity_id, body]
          properties:
            entity_type: { type: string }
            entity_id: { type: string, format: uuid }
            body: { type: string }
            author_id: { type: string, format: uuid }
    CommentInput:
      type: object
      required: [body]
      properties:
        body: { type: string }
    EntityLink:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - $ref: '#/components/schemas/SyncableFields'
        - type: object
          required: [source_type, source_id]
          properties:
            source_type: { type: string }
            source_id: { type: string, format: uuid }
            target_type: { type: string }
            target_id: { type: string, format: uuid }
            url: { type: string, format: uri }
            label: { type: string }
    EntityLinkInput:
      type: object
      properties:
        target_type: { type: string }
        target_id: { type: string, format: uuid }
        url: { type: string, format: uri }
        label: { type: string }
    Call:
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - $ref: '#/components/schemas/SyncableFields'
        - type: object
          required: [title, transcript]
          properties:
            external_id: { type: string }
            title: { type: string }
            occurred_at: { type: string, format: date-time }
            duration_sec: { type: integer }
