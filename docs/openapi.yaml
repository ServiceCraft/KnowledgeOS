openapi: 3.1.0
info:
  title: KnowledgeOS API
  version: 1.0.0
  summary: Полный REST API KnowledgeOS
  description: |
    Единая OpenAPI-спецификация для backend API KnowledgeOS.

    Файл описывает все маршруты, объявленные в `backend/internal/handler/router.go`:
    авторизацию, базу знаний, комментарии, ссылки, поиск, пользователей,
    компании, настройки бота, RAG, чат, синхронизацию, импорт/экспорт и backup.

    Все JSON-ответы backend, кроме backup snapshot, возвращаются в стандартной
    обёртке:

    - успешный одиночный ответ: `{ "data": ... }`;
    - список: `{ "data": [...], "total": 123 }`;
    - ошибка: `{ "error": "message" }`.

    Protected JWT-методы работают в tenant-контексте. Для обычного пользователя
    компания берётся из JWT. Пользователь с ролью `superadmin` обязан передать
    заголовок `X-Company-ID` для tenant-scoped методов; без выбранной компании
    backend возвращает `403`. Глобальные методы `/admin/companies*` доступны
    superadmin без tenant-контекста.
servers:
  - url: http://localhost:8080/api/v1
    description: Локальный backend
  - url: /api/v1
    description: Относительный путь для frontend/proxy
tags:
  - name: Auth
    description: Вход, обновление и отзыв refresh token.
  - name: QA
    description: Q&A-пары базы знаний.
  - name: Themes
    description: Темы, группирующие Q&A.
  - name: Pricing
    description: Узлы дерева прайса.
  - name: Articles
    description: Статьи базы знаний.
  - name: Comments
    description: Комментарии к Q&A, статьям и прайсу.
  - name: Links
    description: Связи или внешние ссылки для сущностей базы знаний.
  - name: Search
    description: Полнотекстовый поиск по базе знаний.
  - name: Calls
    description: Звонки и упоминания Q&A в звонках.
  - name: Sync
    description: Статус и API-key синхронизация локального/cloud контура.
  - name: Users
    description: Администрирование пользователей внутри компании.
  - name: Companies
    description: Системное управление компаниями.
  - name: Bot
    description: Настройки бота и tenant secrets.
  - name: RAG
    description: Индексация и hybrid retrieval базы знаний.
  - name: Bot Chat
    description: Playground/API чат с ботом.
  - name: Channels
    description: Публичные webhook-интеграции Telegram, MAX и VK.
  - name: Import Export
    description: Импорт и экспорт базы знаний.
  - name: Backup
    description: Полный snapshot базы и кода.
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Войти по email и паролю
      description: |
        Проверяет учётные данные, активность пользователя и выдаёт пару JWT:
        короткоживущий `access_token` и долгоживущий `refresh_token`.

        Используйте метод в форме логина. Полученный `access_token` передавайте
        в `Authorization: Bearer <token>` для protected endpoints.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@example.com
              password: changeme123
      responses:
        '200':
          description: Токены и профиль пользователя.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Неверные credentials или деактивированный аккаунт.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Обновить пару токенов
      description: |
        Принимает refresh token, отзывает его и выдаёт новую пару токенов.
        Метод нужен frontend-клиенту для бесшовного продления сессии.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Новые токены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /webhooks/{channel}/{company_id}:
    post:
      tags: [Channels]
      operationId: handleChannelWebhook
      summary: Принять webhook канала
      description: |
        Public endpoint без JWT для входящих обновлений Telegram, MAX и VK.
        Tenant выбирается по `company_id` в URL, а подлинность проверяется
        channel-specific secret из `tenant_secrets.{channel}.metadata`.
      security: []
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
            enum: [telegram, max, vk]
        - name: company_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Обновление принято или проигнорировано без retry.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Бот или канал выключен.
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Выйти и отозвать refresh token
      description: |
        Отзывает переданный refresh token. Access token продолжает жить до
        истечения срока, поэтому клиенту нужно локально удалить оба токена.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          $ref: '#/components/responses/StatusOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /qa:
    get:
      tags: [QA]
      operationId: listQA
      summary: Получить список Q&A
      description: |
        Возвращает Q&A-пары текущей компании с пагинацией, поиском, фильтрами
        по теме, FAQ-флагу и AI review status. Используйте для таблицы базы
        знаний и выбора ответов оператором.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit50'
        - name: query
          in: query
          schema: { type: string }
          description: Поиск по вопросу/ответу.
        - name: theme_id
          in: query
          schema: { type: string, format: uuid }
          description: Фильтр по теме.
        - name: is_faq
          in: query
          schema: { type: boolean }
          description: Фильтр FAQ-записей.
        - name: ai_status
          in: query
          schema: { $ref: '#/components/schemas/AIStatus' }
          description: Фильтр статуса AI-предложенного ответа.
        - name: sort
          in: query
          schema:
            type: string
            enum: [frequency, -frequency, created_at, -created_at]
          description: Сортировка.
      responses:
        '200':
          description: Список Q&A-пар.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAPairListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [QA]
      operationId: createQA
      summary: Создать Q&A-пару
      description: |
        Создаёт новую запись базы знаний. Backend проставляет компанию,
        автора, sync-поля и ставит задачу переиндексации RAG.

        Требует роль `editor`, `admin` или `superadmin`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QAPairInput'
      responses:
        '201':
          description: Созданная Q&A-пара.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAPairEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /qa/{id}:
    get:
      tags: [QA]
      operationId: getQA
      summary: Получить Q&A-пару
      description: Возвращает одну Q&A-пару текущей компании по UUID.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Q&A-пара.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAPairEnvelope'
        '400':
          $ref: '#/components/responses/InvalidID'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [QA]
      operationId: updateQA
      summary: Обновить Q&A-пару
      description: |
        Частично обновляет поля Q&A: `question`, `answer`, `theme_id`,
        `is_faq`, `is_locked`, `frequency`, `ai_answer`, `ai_status`.
        Используйте для редактирования записи без пересоздания UUID.

        Требует роль `editor`, `admin` или `superadmin`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QAPairPatch'
      responses:
        '200':
          description: Обновлённая Q&A-пара.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAPairEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [QA]
      operationId: deleteQA
      summary: Удалить Q&A-пару
      description: |
        Удаляет Q&A-пару текущей компании и планирует удаление из RAG-индекса.
        Требует роль `editor`, `admin` или `superadmin`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Удалено, тело ответа отсутствует.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /qa/{id}/review:
    post:
      tags: [QA]
      operationId: reviewQAAnswer
      summary: Принять, отклонить или отредактировать AI-ответ
      description: |
        Фиксирует результат ревью AI-предложенного ответа для Q&A-пары.
        Метод используется в рабочем процессе, где AI предлагает ответ, а
        редактор подтверждает его, отклоняет или сохраняет отредактированный
        вариант.

        Требует роль `editor`, `admin` или `superadmin`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QAReviewRequest'
            examples:
              accept:
                value: { action: accept }
              edit:
                value:
                  action: edit
                  edited_answer: Обновлённый ответ для операторов.
      responses:
        '200':
          description: Q&A после ревью.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAPairEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /qa/{id}/mentions:
    get:
      tags: [Calls, QA]
      operationId: listQAMentions
      summary: Получить упоминания Q&A в звонках
      description: |
        Возвращает найденные в звонках упоминания конкретной Q&A-пары с
        метаданными звонка. Используйте для контроля, где правило/ответ уже
        встречался в реальных разговорах.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit100'
      responses:
        '200':
          description: Список упоминаний.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QACallMentionListEnvelope'
        '400':
          $ref: '#/components/responses/InvalidID'
        '404':
          $ref: '#/components/responses/NotFound'
  /calls/{id}:
    get:
      tags: [Calls]
      operationId: getCall
      summary: Получить звонок
      description: |
        Возвращает карточку звонка с транскриптом, внешним ID, длительностью и
        ссылкой на аудио. Метод read-only и доступен любому authenticated
        пользователю tenant.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Звонок.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallEnvelope'
        '400':
          $ref: '#/components/responses/InvalidID'
        '404':
          $ref: '#/components/responses/NotFound'
  /themes:
    get:
      tags: [Themes]
      operationId: listThemes
      summary: Получить список тем
      description: Возвращает темы текущей компании с пагинацией и поиском по названию/описанию.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit50'
        - name: query
          in: query
          schema: { type: string }
          description: Поисковая строка.
      responses:
        '200':
          description: Список тем.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeListEnvelope'
    post:
      tags: [Themes]
      operationId: createTheme
      summary: Создать тему
      description: |
        Создаёт тему для группировки Q&A. Требует роль `editor`, `admin` или
        `superadmin`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThemeInput'
      responses:
        '201':
          description: Созданная тема.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /themes/{id}:
    get:
      tags: [Themes]
      operationId: getTheme
      summary: Получить тему
      description: Возвращает тему текущей компании по UUID.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Тема.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeEnvelope'
        '400':
          $ref: '#/components/responses/InvalidID'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Themes]
      operationId: updateTheme
      summary: Обновить тему
      description: Обновляет название и описание темы. Требует роль `editor`, `admin` или `superadmin`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThemeInput'
      responses:
        '200':
          description: Обновлённая тема.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Themes]
      operationId: deleteTheme
      summary: Удалить тему
      description: Удаляет тему. Требует роль `editor`, `admin` или `superadmin`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Удалено.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /themes/{id}/qa:
    get:
      tags: [Themes, QA]
      operationId: listThemeQA
      summary: Получить Q&A внутри темы
      description: Возвращает Q&A-пары выбранной темы с пагинацией.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit50'
      responses:
        '200':
          description: Список Q&A темы.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAPairListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /pricing:
    get:
      tags: [Pricing]
      operationId: listPricing
      summary: Получить узлы прайса
      description: |
        Возвращает дерево/список pricing nodes текущей компании. Можно получить
        только узлы конкретного типа или дочерние узлы конкретного parent.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit50'
        - name: node_type
          in: query
          schema: { type: string }
          description: Тип узла прайса.
        - name: parent_id
          in: query
          schema: { type: string, format: uuid }
          description: Вернуть дочерние узлы указанного parent.
      responses:
        '200':
          description: Список узлов прайса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingNodeListEnvelope'
    post:
      tags: [Pricing]
      operationId: createPricingNode
      summary: Создать узел прайса
      description: Создаёт узел прайса и планирует RAG-переиндексацию. Требует write-role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingNodeInput'
      responses:
        '201':
          description: Созданный узел.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingNodeEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /pricing/{id}:
    get:
      tags: [Pricing]
      operationId: getPricingNode
      summary: Получить узел прайса
      description: Возвращает один pricing node по UUID.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Узел прайса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingNodeEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Pricing]
      operationId: updatePricingNode
      summary: Обновить узел прайса
      description: Обновляет узел прайса. Требует роль `editor`, `admin` или `superadmin`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingNodeInput'
      responses:
        '200':
          description: Обновлённый узел.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingNodeEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Pricing]
      operationId: deletePricingNode
      summary: Удалить узел прайса
      description: Удаляет узел прайса. Требует write-role.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Удалено.
        '400':
          $ref: '#/components/responses/BadRequest'
  /pricing/{id}/move:
    post:
      tags: [Pricing]
      operationId: movePricingNode
      summary: Переместить узел прайса
      description: |
        Меняет `parent_id` узла прайса. Передайте `null`, чтобы сделать узел
        корневым. Используйте для drag-and-drop дерева прайса.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingMoveRequest'
      responses:
        '200':
          $ref: '#/components/responses/StatusOK'
        '400':
          $ref: '#/components/responses/BadRequest'
  /articles:
    get:
      tags: [Articles]
      operationId: listArticles
      summary: Получить статьи
      description: Возвращает статьи текущей компании с пагинацией и поиском.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit50'
        - name: query
          in: query
          schema: { type: string }
          description: Поиск по заголовку/тексту.
      responses:
        '200':
          description: Список статей.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleListEnvelope'
    post:
      tags: [Articles]
      operationId: createArticle
      summary: Создать статью
      description: Создаёт статью базы знаний и планирует RAG-индексацию. Требует write-role.
      security:
        - bearerAuth: []
      requestBody:
