      properties:
        company_id: { type: string, format: uuid }
        enabled: { type: boolean }
        provider: { $ref: '#/components/schemas/BotProvider' }
        model_tier: { $ref: '#/components/schemas/BotModelTier' }
        model: { type: string }
        temperature: { type: number, format: double, minimum: 0, maximum: 2 }
