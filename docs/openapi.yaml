        min_confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Порог уверенности ответа (Б5). 0 отключает авто-отказ по confidence.
        allowed_theme_ids:
          type: array
          items: { type: string, format: uuid }
          description: Разрешённые темы (Б5). Пустой список — без ограничения по теме.
        escalate_on_low_confidence:
          type: boolean
          description: Эскалировать на оператора вместо простого отказа при срабатывании guardrail.
        require_citations:
          type: boolean
          description: Требовать валидную цитату источника, иначе отказ.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UpdateBotSettingsRequest:
