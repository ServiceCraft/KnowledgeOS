        - $ref: '#/components/parameters/Limit50'
      responses:
        '200':
          description: Список комментариев.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Comments]
      operationId: createComment
      summary: Создать комментарий
      description: |
        Создаёт комментарий к сущности базы знаний. Backend берёт `entity_type`,
        `entity_id` и `author_id` из path/JWT, поэтому в body достаточно `body`.
        Требует write-role.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityType'
        - $ref: '#/components/parameters/EntityID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentInput'
      responses:
        '201':
          description: Созданный комментарий.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
  /{entityType}/{entityID}/comments/{id}:
    patch:
      tags: [Comments]
      operationId: updateComment
      summary: Обновить комментарий
      description: Обновляет текст комментария. Требует write-role.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityType'
        - $ref: '#/components/parameters/EntityID'
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentInput'
      responses:
        '200':
          description: Обновлённый комментарий.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags: [Comments]
      operationId: deleteComment
      summary: Удалить комментарий
      description: Удаляет комментарий. Требует write-role.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityType'
        - $ref: '#/components/parameters/EntityID'
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Удалено.
        '400':
          $ref: '#/components/responses/BadRequest'
  /{entityType}/{entityID}/links/:
    get:
      tags: [Links]
      operationId: listLinks
      summary: Получить ссылки сущности
      description: |
        Возвращает связи или внешние ссылки, привязанные к Q&A, статье или
        pricing node. Используйте для отображения связанных материалов.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityType'
        - $ref: '#/components/parameters/EntityID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit50'
      responses:
        '200':
          description: Список ссылок.
