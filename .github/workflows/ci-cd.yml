name: CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            backend/go.sum
            backup-service/go.mod

      - name: Run Go tests
        run: |
          set -e
          (cd backend && go test ./...) &
          (cd backup-service && go test ./...) &
          wait

      - name: Run backend lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: backend
          args: ./...

  frontend-ci:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  build-backend:
    name: Build backend image
    runs-on: ubuntu-latest
    needs: backend-ci
    if: github.event_name == 'push'

    outputs:
      backend_image: ${{ steps.meta.outputs.backend_image }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      latest_tag: ${{ steps.meta.outputs.latest_tag }}
      image_base: ${{ steps.meta.outputs.image_base }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          repo="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::12}"
          safe_ref="$(printf '%s' "${GITHUB_REF_NAME}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+//; s/-+$//')"

          latest_tag="test-latest"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            latest_tag="prod-latest"
          fi

          image_tag="sha-${short_sha}"
          image_base="ghcr.io/${repo}"

          {
            echo "image_tag=${image_tag}"
            echo "latest_tag=${latest_tag}"
            echo "image_base=${image_base}"
            echo "backend_image=${image_base}/backend:${image_tag}"
            echo "backend_tags<<EOF"
            printf '%s\n' \
              "${image_base}/backend:${image_tag}" \
              "${image_base}/backend:branch-${safe_ref}" \
              "${image_base}/backend:${latest_tag}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.backend_tags }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    needs: frontend-ci
    if: github.event_name == 'push'

    outputs:
      frontend_image: ${{ steps.meta.outputs.frontend_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          repo="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::12}"
          safe_ref="$(printf '%s' "${GITHUB_REF_NAME}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+//; s/-+$//')"

          latest_tag="test-latest"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            latest_tag="prod-latest"
          fi

          image_tag="sha-${short_sha}"
          image_base="ghcr.io/${repo}"

          {
            echo "frontend_image=${image_base}/frontend:${image_tag}"
            echo "frontend_tags<<EOF"
            printf '%s\n' \
              "${image_base}/frontend:${image_tag}" \
              "${image_base}/frontend:branch-${safe_ref}" \
              "${image_base}/frontend:${latest_tag}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile.deploy
          push: true
          tags: ${{ steps.meta.outputs.frontend_tags }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  build-backup:
    name: Build backup-service image
    runs-on: ubuntu-latest
    needs: backend-ci
    if: github.event_name == 'push'

    outputs:
      backup_image: ${{ steps.meta.outputs.backup_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect backup-service changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backup:
              - 'backup-service/**'

      - name: Set up Docker Buildx
        if: steps.changes.outputs.backup == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.changes.outputs.backup == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          repo="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::12}"
          safe_ref="$(printf '%s' "${GITHUB_REF_NAME}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+//; s/-+$//')"

          latest_tag="test-latest"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            latest_tag="prod-latest"
          fi

          image_tag="sha-${short_sha}"
          image_base="ghcr.io/${repo}"

          if [ "${{ steps.changes.outputs.backup }}" = "true" ]; then
            backup_image="${image_base}/backup-service:${image_tag}"
            {
              echo "backup_image=${backup_image}"
              echo "backup_tags<<EOF"
              printf '%s\n' \
                "${image_base}/backup-service:${image_tag}" \
                "${image_base}/backup-service:branch-${safe_ref}" \
                "${image_base}/backup-service:${latest_tag}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          else
            echo "backup_image=${image_base}/backup-service:${latest_tag}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and push backup-service image
        if: steps.changes.outputs.backup == 'true'
        uses: docker/build-push-action@v6
        with:
          context: backup-service
          file: backup-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.backup_tags }}
          cache-from: type=gha,scope=backup-service
          cache-to: type=gha,mode=max,scope=backup-service

  build-meta:
    name: Build metadata
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - build-frontend
      - build-backup
    if: github.event_name == 'push'

    outputs:
      backend_image: ${{ needs.build-backend.outputs.backend_image }}
      frontend_image: ${{ needs.build-frontend.outputs.frontend_image }}
      backup_image: ${{ needs.build-backup.outputs.backup_image }}
      image_tag: ${{ needs.build-backend.outputs.image_tag }}

    steps:
      - name: Aggregate build outputs
        run: echo "Build jobs completed."

  deploy_test:
    name: Deploy test
    runs-on: ubuntu-latest
    needs:
      - backend-ci
      - frontend-ci
      - build-meta
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    environment: test
    concurrency:
      group: deploy-test
      cancel-in-progress: true

    steps:
      - name: Checkout deploy files
        uses: actions/checkout@v6

      - name: Deploy over SSH
        env:
          DEPLOY_ENV: test
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN || github.token }}
          COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME || 'knowledgeos-test' }}
          FRONTEND_IMAGE: ${{ needs.build-meta.outputs.frontend_image }}
          BACKEND_IMAGE: ${{ needs.build-meta.outputs.backend_image }}
          BACKUP_IMAGE: ${{ needs.build-meta.outputs.backup_image }}
          IMAGE_TAG: ${{ needs.build-meta.outputs.image_tag }}
          SMOKE_URL: ${{ vars.SMOKE_URL }}
        run: ./scripts/deploy-compose-ssh.sh

  deploy_prod:
    name: Deploy production
    runs-on: ubuntu-latest
    needs:
      - backend-ci
      - frontend-ci
      - build-meta
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - name: Checkout deploy files
        uses: actions/checkout@v6

      - name: Deploy over SSH
        env:
          DEPLOY_ENV: prod
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN || github.token }}
          COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME || 'knowledgeos-prod' }}
          FRONTEND_IMAGE: ${{ needs.build-meta.outputs.frontend_image }}
          BACKEND_IMAGE: ${{ needs.build-meta.outputs.backend_image }}
          BACKUP_IMAGE: ${{ needs.build-meta.outputs.backup_image }}
          IMAGE_TAG: ${{ needs.build-meta.outputs.image_tag }}
          SMOKE_URL: ${{ vars.SMOKE_URL }}
        run: ./scripts/deploy-compose-ssh.sh
